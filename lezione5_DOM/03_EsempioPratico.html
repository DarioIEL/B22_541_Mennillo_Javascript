<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1>Esempio</h1>
    
    <section>
        <h3>Tab con una classe active una alla volta</h3>
        <span data-target="home" class="tab attivo">Home</span>
        <span data-target="corsi" class="tab">Corsi</span>
        <span data-target="docenti" class="tab">Docenti</span>
        <span data-target="todoList" class="tab">ToDo List</span>
        <span data-target="contatti" class="tab">Contatti</span>
        <span id="tabScelto">Hai scelto: Home</span>
    </section>

    <section id="main">
        <div class="box" id="home">Home</div>
        <div class="box nascosto" id="corsi">Corsi</div>
        <div class="box nascosto" id="docenti">Docenti</div>
        
        <div class="box nascosto" id="todoList">
            ToDo List
        
            <input type="text" id="itemTodo" placeholder="inserisci cosa fare">
            <button type="button" id="btnAdd">Add</button>

            <ul id="lista"></ul>
        
        </div>

        <div class="box nascosto" id="contatti">Contatti</div>
    </section>

    <script src="./js/script03.js"></script>
    <script src="./js/script03TODO.js"></script>
</body>
</html>
