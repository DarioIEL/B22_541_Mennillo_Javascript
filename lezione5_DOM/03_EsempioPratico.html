<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1>Esempio</h1>
    
    <section>
        <h3>Tab con una classe active una alla volta</h3>
        <span class="tab attivo">Home</span>
        <span class="tab">Corsi</span>
        <span class="tab">Docenti</span>
        <span class="tab">Contatti</span>
        <span id="tabScelto">Hai scelto: Home</span>
    </section>

    <section id="main">
        <div class="box" id="home">Home</div>
        <div class="box nascosto" id="corsi">Corsi</div>
        <div class="box nascosto" id="docenti">Docenti</div>
        <div class="box nascosto" id="contatti">Contatti</div>
    </section>

    <script src="./js/script03.js"></script>
</body>
</html>
